<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f5e">

    <title>ID2Go | Sign In</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-client.js"></script>
    <script defer src="js/auth/auth.js"></script>
</head>

<body>
    <main class="auth-shell">

        <header class="auth-header">
            <img src="img/logo.png" alt="Xavier University">

            <h1>Xavier University</h1>
            <p>STUDENT ID SERVICES</p>
        </header>

        <section class="auth-content">

            <div class="auth-heading">
                <span class="auth-eyebrow">ID2GO PORTAL</span>
                <h2>Sign in to your account</h2>
                <p>
                    Access your student ID services using
                    your registered account.
                </p>
            </div>

            <form id="login-form" class="auth-card">
                <h3>Account Login</h3>

                <label for="login-email">
                    Email Address
                </label>

                <input id="login-email" type="email" placeholder="Enter your registered email" autocomplete="username"
                    required>

                <label for="login-password">
                    Password
                </label>

                <div class="password-field">
                    <input id="login-password" type="password" placeholder="Enter your password"
                        autocomplete="current-password" required>

                    <button id="toggle-password" type="button" aria-label="Show password">
                        Show
                    </button>
                </div>

                <p id="login-error" class="auth-error" role="alert" hidden></p>

                <button id="login-button" type="submit" class="ui-button ui-button-primary">
                    Sign In
                </button>
            </form>

        </section>
    </main>
</body>

</html>
