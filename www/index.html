<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f5e">
    <title>ID2Go | Sign In</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-client.js"></script>
    <script defer src="js/auth/auth.js"></script>
</head>

<body>
    <main class="auth-shell">

        <header class="auth-hero">
            <div class="hero-shape hero-shape-one"></div>
            <div class="hero-shape hero-shape-two"></div>

            <div class="university-brand">
                <img src="img/logo.png" alt="Xavier University seal">
                <div>
                    <h1>Xavier University</h1>
                    <p>STUDENT ID SERVICES</p>
                </div>
            </div>

            <div class="hero-content">
                <span class="hero-eyebrow">
                    WELCOME TO ID2GO
                </span>

                <h2>Your student ID services, simplified.</h2>

                <p>
                    Manage your appointments, track your queue,
                    and stay informed in one place.
                </p>
            </div>
        </header>

        <section class="auth-content">
            <div class="auth-heading">
                <h2>Sign in</h2>
                <p>Enter your registered account credentials.</p>
            </div>

            <form id="login-form" class="auth-card">
                <div class="form-group">
                    <label for="login-email">Email address</label>
                    <input id="login-email" type="email" placeholder="Enter your email" autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-field">
                        <input id="login-password" type="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button id="toggle-password" type="button" aria-label="Show password">
                            Show
                        </button>
                    </div>
                </div>

                <p id="login-error" class="auth-error" role="alert" hidden></p>

                <button id="login-button" class="auth-submit" type="submit">
                    Sign In
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="auth-note">
                Account access is provided by the
                ID2Go system administrator.
            </p>
        </section>

    </main>
</body>

</html>
