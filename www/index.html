<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ID2Go | Login</title>

    <link rel="stylesheet" href="css/navigation.css">
</head>

<body class="id2go-page">

    <main class="auth-container">

        <div class="auth-logo">
            <img src="img/logo.png" alt="ID2Go Logo">
        </div>

        <h1>ID2Go</h1>
        <p class="auth-subtitle">
            Xavier University - Ateneo de Cagayan
            <br>
            Student ID Appointment and Queue Management
        </p>

        <section class="auth-card">

            <h2>Welcome!</h2>
            <p>Select your role to continue.</p>

            <div class="role-selection">
                <button type="button" class="role-btn active" data-role="student">
                    Student
                </button>

                <button type="button" class="role-btn" data-role="operator">
                    Camera Operator
                </button>

                <button type="button" class="role-btn" data-role="admin">
                    Administrator
                </button>
            </div>

            <form id="login-form">

                <div id="student-fields">
                    <label for="student-id">
                        Student ID Number
                    </label>
                    <input type="text" id="student-id" placeholder="e.g. 2024-0001" required>

                    <label for="student-name">
                        Full Name
                    </label>
                    <input type="text" id="student-name" placeholder="Enter your full name" required>
                </div>

                <p id="login-message" class="login-message" aria-live="polite"></p>

                <button type="submit" class="primary-btn">
                    Continue
                </button>

            </form>

        </section>

        <p class="auth-footer">
            ID2Go • Student Services
        </p>

    </main>

    <script>
        let selectedRole = "student";

        const roleButtons =
            document.querySelectorAll(".role-btn");

        const studentFields =
            document.getElementById("student-fields");

        const message =
            document.getElementById("login-message");

        roleButtons.forEach(button => {
            button.addEventListener("click", () => {
                selectedRole = button.dataset.role;

                roleButtons.forEach(btn => {
                    btn.classList.remove("active");
                });

                button.classList.add("active");

                studentFields.hidden =
                    selectedRole !== "student";

                studentFields.querySelectorAll("input")
                    .forEach(input => {
                        input.required =
                            selectedRole === "student";
                    });

                message.textContent = "";
            });
        });

        document.getElementById("login-form")
            .addEventListener("submit", event => {
                event.preventDefault();

                if (selectedRole === "student") {
                    const id = document
                        .getElementById("student-id")
                        .value.trim();

                    const name = document
                        .getElementById("student-name")
                        .value.trim();

                    if (!id || !name) return;

                    localStorage.setItem(
                        "id2go_student",
                        JSON.stringify({ id, name })
                    );

                    window.location.href = "dashboard.html";
                }

                else if (selectedRole === "operator") {
                    window.location.href = "operator.html";
                }

                else {
                    message.textContent =
                        "Camera Operator module is not yet available.";
                }
            });
    </script>

</body>

</html>
