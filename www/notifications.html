<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102f5e">

    <title>ID2Go | Notifications</title>

    <link rel="stylesheet" href="css/global.css">



    <script defer src="cordova.js"></script>
    <script defer src="vendor/supabase.js"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/supabase-client.js"></script>
    <script defer src="js/notifications/notifications.js"></script>
<link rel="stylesheet" href="css/student-nav.css">
<script defer src="js/student-nav.js"></script>
    <link rel="stylesheet" href="css/university.css">
<link rel="stylesheet" href="css/notifications.css">
</head>

<body class="page-notifications">
    <div class="notifications-shell">

        <header class="inbox-header"><a href="dashboard.html" aria-label="Back to dashboard">←</a><h1>Notifications</h1><span id="unread-badge" aria-label="Unread notifications" hidden></span></header>
        <main class="inbox-content"><div class="inbox-toolbar">
                <div class="notification-filters" role="group" aria-label="Filter notifications">
                    <button type="button" class="filter-button active" data-filter="all" aria-pressed="true" disabled>
                        All
                    </button>

                    <button type="button" class="filter-button" data-filter="unread" aria-pressed="false" disabled>
                        Unread
                    </button>
                </div>

                <button id="mark-all-read" type="button" disabled>Mark all as read</button></div><p id="notification-feedback" class="notification-feedback" role="status" aria-live="polite"></p>

                <section id="notifications-list" class="notifications-list" aria-label="Student notifications">
                </section>

                <div id="notifications-empty" class="empty-notifications" hidden>
                    <div class="empty-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
                            <path d="M10 21h4" />
                        </svg>
                    </div>

                    <h3>No notifications yet</h3>
                    <p>
                        Appointment confirmations and queue
                        updates will appear here.
                    </p>
                </div>
        </main>
    </div>
</body>

</html>
