<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102f5e">
    <title>ID2Go | Student Profile</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/profile.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-client.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/profile.js"></script>
</head>

<body>
    <div class="app-shell">

        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <img src="img/logo.png" alt="Xavier University seal">
                    <div class="brand-copy">
                        <h1>Xavier University</h1>
                        <p>STUDENT ID SERVICES</p>
                    </div>
                </div>
            </div>

            <div class="welcome">
                <h2>My Profile</h2>
                <span>Student information and settings</span>
            </div>
        </header>

        <main class="profile-content">
            <form id="profile-form">

                <section class="content-card">
                    <h2>Personal Information</h2>

                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName"
                           placeholder="e.g. Juan Dela Cruz" required>

                    <label for="studentId">Student ID Number</label>
                    <input type="text" id="studentId" name="studentId"
                           placeholder="e.g. 2023-0001" required>

                    <label for="courseProgram">Course / Program</label>
                    <select id="courseProgram" name="courseProgram" required>
                        <option value="" disabled selected>
                            Select Course / Program
                        </option>
                        <option value="BS Information Technology">BS Information Technology</option>
                        <option value="BS Computer Science">BS Computer Science</option>
                        <option value="BS Information Systems">BS Information Systems</option>
                        <option value="BS Business Administration">BS Business Administration</option>
                        <option value="BS Accountancy">BS Accountancy</option>
                        <option value="BS Nursing">BS Nursing</option>
                        <option value="BS Civil Engineering">BS Civil Engineering</option>
                        <option value="AB Psychology">AB Psychology</option>
                        <option value="AB Communication">AB Communication</option>
                    </select>

                    <label for="yearLevel">Year Level</label>
                    <select id="yearLevel" name="yearLevel" required>
                        <option value="" disabled selected>Select Year Level</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="5th Year">5th Year</option>
                    </select>

                    <label for="email">University Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="e.g. student@xu.edu.ph" required>

                    <label for="mobileNumber">Mobile Number</label>
                    <input type="tel" id="mobileNumber" name="mobileNumber"
                           placeholder="e.g. 09123456789" required>
                </section>

                <section class="content-card">
                    <h2>Emergency Contact</h2>
                    <p class="section-description">
                        Provide the details of someone we can contact
                        in case of an emergency.
                    </p>

                    <label for="emergencyName">Contact Name</label>
                    <input type="text" id="emergencyName"
                           name="emergencyName"
                           placeholder="Enter contact name" required>

                    <label for="emergencyRelationship">Relationship</label>
                    <select id="emergencyRelationship"
                            name="emergencyRelationship" required>
                        <option value="" disabled selected>
                            Select relationship
                        </option>
                        <option value="Parent">Parent</option>
                        <option value="Guardian">Guardian</option>
                        <option value="Spouse">Spouse</option>
                        <option value="Sibling">Sibling</option>
                        <option value="Relative">Relative</option>
                        <option value="Friend">Friend</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="emergencyPhone">Emergency Contact Number</label>
                    <input type="tel" id="emergencyPhone"
                           name="emergencyPhone"
                           placeholder="Enter emergency contact number"
                           required>
                </section>

                <section class="content-card account-settings">
                    <h2>Account Settings</h2>

                    <button type="submit"
                            class="booking-button"
                            id="save-profile-btn">
                        <span>Save Profile Changes</span>
                        <span aria-hidden="true">✓</span>
                    </button>

                    <button type="button"
                            class="booking-button"
                            id="logout-button">
                        <span>Log Out</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </section>

            </form>
        </main>

        <nav class="bottom-navigation" aria-label="Student navigation">
            <a href="dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="m3 10 9-7 9 7v10H3z"/>
                    <path d="M9 21v-7h6v7"/>
                </svg>
                <span>Home</span>
            </a>

            <a href="booking.html" class="nav-link"
               data-feature="booking">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                    <path d="M7 3v4M17 3v4M3 10h18"/>
                </svg>
                <span>Book</span>
            </a>

            <a href="profile.html" class="nav-link active"
               aria-current="page">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>

    </div>
</body>
</html>
